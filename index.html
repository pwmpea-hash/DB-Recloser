single=true&output=csv';let DATA=[];function parseCSV(text){const rows=[];let row=[],field='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')q=false;else field+=c}else{if(c==='"')q=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}}if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}return rows}let sheetLoadBusy=false;async function loadSheet(){if(sheetLoadBusy)return;sheetLoadBusy=true;const st=document.getElementById('sheetStatus'),txt=document.getElementById('sheetStatusText'),btn=document.getElementById('sheetRefreshBtn');try{st.className='sheetStatus loading';txt.textContent='กำลังโหลดข้อมูลจาก Google Sheet...';btn.disabled=true;const url=SHEET_CSV_URL+'&_ts='+Date.now();const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const buf=await res.arrayBuffer();let text=new TextDecoder('utf-8',{fatal:false}).decode(buf);text=text.replace(/^\uFEFF/,'');const rows=parseCSV(text);if(rows.length<2)throw new Error('ไม่พบข้อมูลในชีต');const headers=rows.shift().map((h,i)=>String(h).replace(/^\uFEFF/,'').trim()||('COL'+i));const fresh=rows.filter(r=>r.some(v=>String(v).trim()!=='' )).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()]))).map(r=>({...r,Lat:r.Lat??'',Long:r.Long??''}));const firstLoad=DATA.length===0;DATA=fresh;if(firstLoad)initializeApp();else{refreshOrg();render()}const now=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});st.className='sheetStatus ok';txt.textContent='โหลดข้อมูลจาก Google Sheet สำเร็จ / จำนวน '+DATA.length.toLocaleString('th-TH')+' รายการ / อัปเดตล่าสุด '+now}catch(err){console.error(err);st.className='sheetStatus err';txt.textContent='โหลดข้อมูล Google Sheet ไม่สำเร็จ: '+err.message}finally{btn.disabled=false;sheetLoadBusy=false}};const COLS=["เขต","TAG","FACILITYID","LOCATION","WBS","PEANO","NAME","OWNER","พิกัด"];let sort={k:COLS[0],asc:true},filtered=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function opts(id,key){const s=$(id);let a=[...new Set(DATA.map(x=>String(x[key]??'')).filter(Boolean))];if(id==='area'){const order=['น1','น2','น3','ฉ1','ฉ2','ฉ3','ก1','ก2','ก3','ต1','ต2','ต3'];a=order.filter(v=>a.includes(v))}else{a.sort((a,b)=>a.localeCompare(b,'th',{numeric:true}))}a.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}function initializeApp(){opts('area','เขต');$('q').value='';$('area').value='';$('org').value='';function refreshOrg(){const area=$('area').value,current=$('org').value;const names=[...new Set(DATA.filter(r=>!area||String(r['เขต'])===area).map(r=>String(r.NAME??'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th',{numeric:true}));$('org').innerHTML='<option value="">กฟฟ.</option>'+names.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(names.includes(current))$('org').value=current}refreshOrg();$('all').textContent=DATA.length.toLocaleString('th-TH');function render(){let q=$('q').value.trim().toLowerCase(),area=$('area').value,org=$('org').value;filtered=DATA.filter(r=>(!area||String(r['เขต'])===area)&&(!org||String(r.NAME)===org)&&(ownerFilter===null||(ownerFilter===''?String(r.OWNER??'').trim()==='':String(r.OWNER??'').trim().toUpperCase()===ownerFilter))&&(!q||[...COLS,'Lat','Long'].some(k=>String(k==='พิกัด'?((r.Lat??'')+','+(r.Long??'')):r[k]??'').toLowerCase().includes(q))));filtered.sort((a,b)=>{let x=sort.k==='พิกัด'?((a.Lat??'')+','+(a.Long??'')):(a[sort.k]??''),y=sort.k==='พิกัด'?((b.Lat??'')+','+(b.Long??'')):(b[sort.k]??'');if(typeof x==='number'&&typeof y==='number')return sort.asc?x-y:y-x;return(sort.asc?1:-1)*String(x).localeCompare(String(y),'th',{numeric:true})});$('shown').textContent=filtered.length.toLocaleString('th-TH');$('totalDevices').textContent=filtered.length.toLocaleString('th-TH');$('ownerPEA').textContent=filtered.filter(r=>String(r.OWNER??'').trim().toUpperCase()==='PEA').length.toLocaleString('th-TH');$('ownerCUST').textContent=filtered.filter(r=>String(r.OWNER??'').trim().toUpperCase()==='CUST').length.toLocaleString('th-TH');$('ownerSPP').textContent=filtered.filter(r=>String(r.OWNER??'').trim().toUpperCase()==='SPP').length.toLocaleString('th-TH');$('ownerBlank').textContent=filtered.filter(r=>String(r.OWNER??'').trim()==='').length.toLocaleString('th-TH');document.querySelectorAll('.ownerCard').forEach(c=>c.classList.toggle('selected',ownerFilter!==null&&c.dataset.owner===ownerFilter));['totalDevices','ownerPEA','ownerCUST','ownerSPP','ownerBlank'].forEach(id=>{const el=$(id);el.classList.remove('kpiUpdated');void el.offsetWidth;el.classList.add('kpiUpdated');setTimeout(()=>el.classList.remove('kpiUpdated'),180)});const counts={};filtered.forEach(r=>{const x=String(r['เขต']??'').trim()||'ไม่ระบุ';if(String(r.TAG??'').trim())counts[x]=(counts[x]||0)+1});const order=['น1','น2','น3','ฉ1','ฉ2','ฉ3','ก1','ก2','ก3','ต1','ต2','ต3'];const entries=order.map(k=>[k,counts[k]||0]),mx=Math.max(1,...entries.map(x=>x[1]));$('bars').innerHTML=entries.map(([k,v])=>`<div class="baritem ${area===k?'selected':''}" data-area="${esc(k)}" role="button" tabindex="0" title="เลือกเขต ${esc(k)}"><div class="barval">${v.toLocaleString('th-TH')}</div><div class="bar" style="height:${Math.max(2,v/mx*170)}px" title="${esc(k)}: ${v}"></div><div class="barlbl">${esc(k)}</div></div>`).join('');$('bars').querySelectorAll('.baritem').forEach(el=>{const choose=()=>{$('area').value=($('area').value===el.dataset.area?'':el.dataset.area);refreshOrg();render()};el.addEventListener('click',choose);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}})});$('empty').hidden=filtered.length>0;$('body').innerHTML=filtered.slice(0,2500).map(r=>'<tr>'+COLS.map(k=>{let raw=k==='พิกัด'?((r.Lat!==''&&r.Long!=='')?r.Lat+','+r.Long:''):r[k],v=esc(raw);if(k==='พิกัด'&&r.Lat!==''&&r.Long!=='')return `<td class="coord"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(r.Lat+','+r.Long)}">${v}</a></td>`;return '<td>'+v+'</td>'}).join('')+'</tr>').join('')+(filtered.length>2500?`<tr><td colspan="${COLS.length}">แสดง 2,500 รายการแรก โปรดกรองเพื่อดูข้อมูลเฉพาะเจาะจง</td></tr>`:'')}COLS.forEach(k=>{let th=document.createElement('th');th.textContent=k;$('head').appendChild(th)});document.querySelectorAll('.ownerCard').forEach(c=>{const choose=()=>{ownerFilter=(ownerFilter!==null&&ownerFilter===c.dataset.owner)?null:c.dataset.owner;render()};c.addEventListener('click',choose);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}})});$('q').addEventListener('input',render);$('org').addEventListener('change',render);$('area').addEventListener('change',()=>{refreshOrg();render()});$('reset').onclick=()=>{['q','area','org'].forEach(id=>$(id).value='');ownerFilter=null;refreshOrg();render()};$('q').value='';$('area').value='';$('org').value='';ownerFilter=null;refreshOrg();render();}document.getElementById('sheetRefreshBtn').addEventListener('click',()=>location.reload());loadSheet();</script></body></html>
